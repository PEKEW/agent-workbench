function modal(title,body,buttons,onSubmit){$('dialog-title').textContent=title;$('dialog-body').innerHTML=body;$('dialog-footer').innerHTML=buttons;dialogSubmit=onSubmit;$('dialog').showModal()}
function closeModal(){$('dialog').close();dialogSubmit=null}
$('dialog-form').addEventListener('submit',e=>{e.preventDefault();if(dialogSubmit)dialogSubmit()});$('dialog-close').onclick=closeModal;
$('dialog').addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeModal()});
function dateLabel(s){return new Date(s).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}
function renderNav(){
 $('workspace-name').textContent=state.title;$('document-count').textContent=String(state.documents.length).padStart(2,'0');
 $('document-list').innerHTML=state.documents.map(d=>{const n=state.threads.filter(t=>t.documentId===d.id&&t.status==='open').length;return `<button class="doc-link ${d.id===doc().id?'active':''}" data-doc="${esc(d.id)}" ${d.id===doc().id?'aria-current="page"':''}><span class="doc-glyph">${esc(d.kind.slice(0,1))}</span><span class="doc-link-text"><span class="doc-name">${esc(d.title)}</span><span class="doc-kind">${esc(d.kind)}</span></span>${n?`<span class="doc-count">${n}</span>`:''}</button>`}).join('');
}
function renderArticle(){
 const d=doc();$('breadcrumb').textContent=d.title;$('document-title').textContent=d.title;$('document-tag').textContent=d.kind;$('document-revision').textContent='REV. '+String(d.revision).padStart(2,'0');$('document-wordcount').textContent=d.markdown.replace(/\s/g,'').length.toLocaleString()+' 字符';$('source-label').textContent=d.source||d.id;document.title=d.title+' · Margin';
 const html=marked.parse(d.markdown,{gfm:true,breaks:false});
 $('article').innerHTML=DOMPurify.sanitize(html,{ALLOWED_TAGS:['p','h1','h2','h3','h4','h5','h6','blockquote','ul','ol','li','pre','code','strong','em','del','s','a','hr','br','table','thead','tbody','tr','th','td','input','sup','sub','details','summary'],ALLOWED_ATTR:['href','title','start','align','type','checked','disabled'],ALLOW_DATA_ATTR:false});
 $('article').querySelectorAll('input').forEach(el=>{if(el.type==='checkbox'){el.disabled=true;el.parentElement.classList.add('task-list-item')}else el.remove()});
 $('article').querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'});
 Array.from($('article').children).forEach((el,i)=>el.dataset.block=i);
 if(selectedThread)highlightThread(selectedThread,false);
}
function locate(anchor){
 if(!anchor)return{element:null,reason:''};
 const matches=Array.from($('article').children).filter(el=>el.textContent.includes(anchor.quote));
 if(matches.length===1)return{element:matches[0],reason:''};
 if(matches.length>1){const contextual=matches.filter(el=>el.textContent.includes((anchor.before||'')+anchor.quote+(anchor.after||'')));if(contextual.length===1)return{element:contextual[0],reason:''};return{element:null,reason:'原文有多处匹配，请结合引用确认位置'}}
 return{element:null,reason:'原文已变更 · 引用与讨论已保留'};
}
function highlightThread(threadId,scroll=true){
 $('article').querySelectorAll('.anchored').forEach(el=>el.classList.remove('anchored'));
 const t=state.threads.find(t=>t.id===threadId);if(!t)return;const found=locate(t.anchor);if(found.element){found.element.classList.add('anchored');if(scroll)found.element.scrollIntoView({behavior:'smooth',block:'center'})}else if(scroll&&found.reason)toast(found.reason);
}
function renderThreads(){
 const all=state.threads.filter(t=>t.documentId===doc().id);$('thread-total').textContent=all.length;$('pending-count').textContent=all.filter(t=>t.status==='open').length+' 条待处理';
 const list=all.filter(t=>(filter==='all'||t.kind===filter)&&(statusFilter==='all'||t.status===statusFilter));
 $('thread-list').innerHTML=list.length?list.map(t=>{
 const warning=locate(t.anchor).reason, draft=replyDrafts.get(t.id);
 const today=new Date().toLocaleDateString('sv-SE');
 return `<section class="thread ${t.status==='resolved'?'resolved':''} ${t.id===selectedThread?'selected':''}" data-thread="${esc(t.id)}"><div class="thread-top"><span class="thread-type">${t.kind==='memo'?'◷ 备忘':'◌ 批注'} <span style="color:#c1c9bc">·</span> ${t.messages.length} 条消息</span><span class="status-badge">${t.status==='resolved'?'✓ 已解决':'待处理'}</span></div>${t.anchor?`<button class="thread-quote" data-locate="${esc(t.id)}" title="定位原文">“${esc(t.anchor.quote)}”</button>`:''}${warning?`<p class="anchor-warning">${esc(warning)}</p>`:''}${t.dueDate?`<div class="due ${t.dueDate<today&&t.status==='open'?'overdue':''}">◷ ${esc(t.dueDate)}${t.dueDate<today&&t.status==='open'?' · 已过期':''}</div>`:''}${t.messages.map(m=>`<div class="message"><div class="message-meta"><span class="avatar ${m.role==='agent'?'agent':''}">${esc(m.author.slice(0,1).toUpperCase())}</span><span class="author" title="${esc(m.author)}">${esc(m.author)}</span><span class="role">${m.role==='agent'?'AGENT':'YOU'}</span>${m.intent!=='comment'?`<span class="intent ${m.intent}">${labels[m.intent]}</span>`:''}</div><div class="message-body">${esc(m.body)}</div><div class="message-time">${esc(dateLabel(m.createdAt))}</div></div>`).join('')}<div class="thread-bottom"><button class="quiet small" data-reply="${esc(t.id)}">↳ 回复</button><button class="quiet small" data-resolve="${esc(t.id)}">${t.status==='resolved'?'重新打开':'✓ 标记解决'}</button></div><div class="reply-form" data-reply-form="${esc(t.id)}" ${draft?'':'hidden'}><textarea placeholder="补充意见、证据或修改建议…" aria-label="回复内容" data-reply-body="${esc(t.id)}">${esc(draft?.body||'')}</textarea><div class="reply-actions"><select aria-label="回复类型" data-reply-intent="${esc(t.id)}"><option value="comment">普通回复</option><option value="rebuttal" ${draft?.intent==='rebuttal'?'selected':''}>Rebuttal · 反驳</option><option value="decision" ${draft?.intent==='decision'?'selected':''}>结论</option></select><button class="primary small" data-send="${esc(t.id)}">发送回复</button></div></div></section>`;
 }).join(''):`<div class="empty"><span class="empty-symbol">${filter==='memo'?'◷':'◎'}</span>${statusFilter==='resolved'?'还没有已解决的讨论':'这里还没有讨论'}<br>选中原文，留下第一条想法。</div>`;
}
function render(){renderNav();renderArticle();renderThreads();$('recover-button').hidden=!recoveredDraft;if(cacheWarning){$('storage-warning').textContent=cacheWarning;$('storage-warning').hidden=false}}
function setEditing(on){editing=on;$('article').hidden=on;$('editor-section').hidden=!on;$('read-tab').classList.toggle('active',!on);$('edit-tab').classList.toggle('active',on);$('read-tab').setAttribute('aria-pressed',String(!on));$('edit-tab').setAttribute('aria-pressed',String(on));$('selection-tool').hidden=true;if(on){$('markdown-editor').value=doc().markdown;editingDirty=false;$('markdown-editor').focus()}}
function saveEditor(showToast=true){if(!editing)return;const value=$('markdown-editor').value;if(value!==doc().markdown){doc().markdown=value;doc().revision++;doc().updatedAt=now();save()}editingDirty=false;setEditing(false);render();if(showToast)toast('正文已保存，批注与讨论已保留')}
function leaveEditor(next){if(editingDirty){modal('正文还未保存','<p>保存当前修改后再继续，或放弃本次编辑。</p>','<button type="button" data-close>继续编辑</button><button type="button" id="discard-action">放弃修改</button><button class="primary" type="submit">保存并继续</button>',()=>{saveEditor(false);closeModal();next()});$('discard-action').onclick=()=>{editingDirty=false;setEditing(false);closeModal();next()}}else{if(editing)setEditing(false);next()}}
$('edit-tab').onclick=()=>{if(!editing)setEditing(true)};$('read-tab').onclick=()=>leaveEditor(()=>render());$('save-edit').onclick=()=>saveEditor();$('cancel-edit').onclick=()=>leaveEditor(()=>render());
$('markdown-editor').addEventListener('input',()=>{editingDirty=$('markdown-editor').value!==doc().markdown;$('save-state').textContent=editingDirty?'正文有未保存修改':'已保存到此浏览器'});
$('document-list').onclick=e=>{const el=e.target.closest('[data-doc]');if(el)leaveEditor(()=>{selectedDoc=el.dataset.doc;selectedThread=null;pendingAnchor=null;render();$('content').scrollTop=0})};
function captureSelection(){
 if(editing||$('dialog').open)return;const selection=window.getSelection();if(!selection||selection.isCollapsed||!selection.rangeCount){$('selection-tool').hidden=true;return}
 const range=selection.getRangeAt(0);if(!$('article').contains(range.startContainer)||!$('article').contains(range.endContainer)){$('selection-tool').hidden=true;return}
 function block(node){let el=node.nodeType===1?node:node.parentElement;while(el&&el.parentElement!==$('article'))el=el.parentElement;return el}
 const start=block(range.startContainer),end=block(range.endContainer);if(start!==end){$('selection-tool').hidden=true;return}
 const quote=selection.toString();if(!quote.trim()||quote.length>20000)return;
 const all=start.textContent,index=all.indexOf(quote);if(index<0)return;
 pendingAnchor={quote,before:all.slice(Math.max(0,index-48),index),after:all.slice(index+quote.length,index+quote.length+48),revision:doc().revision};
 const rect=range.getBoundingClientRect();$('selection-tool').hidden=false;$('selection-tool').style.left=Math.min(Math.max(12,rect.left),window.innerWidth-165)+'px';$('selection-tool').style.top=Math.max(8,rect.top-42)+'px';
}
$('article').addEventListener('mouseup',()=>setTimeout(captureSelection,10));$('article').addEventListener('keyup',captureSelection);
$('content').addEventListener('scroll',()=>$('selection-tool').hidden=true);
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#selection-tool')&&!e.target.closest('#article')){$('selection-tool').hidden=true}});
function compose(kind,anchor=null){
 $('selection-tool').hidden=true;const currentAnchor=anchor?clone(anchor):null;const title=kind==='memo'?'添加备忘':'添加批注';
 modal(title,`${currentAnchor?`<blockquote class="modal-quote">${esc(currentAnchor.quote)}</blockquote>`:`<p style="font-size:12px;color:var(--muted)">关联文档：${esc(doc().title)}${kind==='comment'?' · 选中正文可创建针对具体文字的批注':''}</p>`}<label class="field"><span>${kind==='memo'?'需要记住什么？':'你的想法'}</span><textarea id="compose-body" required maxlength="20000" placeholder="写下问题、建议或下一步…"></textarea></label><div class="form-row"><label class="field"><span>消息意图</span><select id="compose-intent"><option value="comment">普通意见</option><option value="rebuttal">Rebuttal · 反驳</option><option value="decision">结论</option></select></label>${kind==='memo'?'<label class="field"><span>备忘日期（可选）</span><input type="date" id="compose-date"></label>':''}</div>${kind==='memo'?'<p style="font-size:11px;color:var(--muted)">日期用于列表中的到期提示；页面关闭时不会推送通知。</p>':''}`,'<button type="button" data-close>取消</button><button class="primary" type="submit">保存</button>',()=>{
 const body=$('compose-body').value.trim();if(!body){$('compose-body').focus();return}const t={id:uid(),documentId:doc().id,kind,status:'open',dueDate:kind==='memo'?$('compose-date').value:'',anchor:currentAnchor,messages:[message(body,$('compose-intent').value)]};state.threads.push(t);selectedThread=t.id;filter='all';statusFilter='all';$('status-filter').value='all';updateFilters();save();closeModal();window.getSelection()?.removeAllRanges();pendingAnchor=null;renderNav();renderThreads();highlightThread(t.id,false);toast(kind==='memo'?'备忘已保存':'批注已保存');
 });$('compose-body').focus();
}
$('selection-tool').onpointerdown=e=>e.preventDefault();$('selection-tool').onclick=()=>compose('comment',pendingAnchor);
$('add-comment').onclick=()=>compose('comment');$('panel-add').onclick=()=>compose('comment');$('add-memo').onclick=()=>compose('memo');
function updateFilters(){document.querySelectorAll('[data-filter]').forEach(el=>{el.classList.toggle('active',el.dataset.filter===filter);el.setAttribute('aria-pressed',String(el.dataset.filter===filter))})}
document.querySelectorAll('[data-filter]').forEach(el=>el.onclick=()=>{filter=el.dataset.filter;updateFilters();renderThreads()});$('status-filter').onchange=e=>{statusFilter=e.target.value;renderThreads()};
$('thread-list').addEventListener('input',e=>{const el=e.target.closest('[data-reply-body]');if(el){const threadId=el.dataset.replyBody;replyDrafts.set(threadId,{body:el.value,intent:el.closest('.reply-form').querySelector('select').value})}});
$('thread-list').addEventListener('change',e=>{const el=e.target.closest('[data-reply-intent]');if(el)replyDrafts.set(el.dataset.replyIntent,{body:el.closest('.reply-form').querySelector('textarea').value,intent:el.value})});
$('thread-list').onclick=e=>{
 const locateButton=e.target.closest('[data-locate]');if(locateButton){selectedThread=locateButton.dataset.locate;highlightThread(selectedThread);renderThreads();return}
 const reply=e.target.closest('[data-reply]');if(reply){const form=reply.closest('.thread').querySelector('.reply-form');form.hidden=!form.hidden;if(!form.hidden){if(!replyDrafts.has(reply.dataset.reply))replyDrafts.set(reply.dataset.reply,{body:'',intent:'comment'});form.querySelector('textarea').focus()}return}
 const resolve=e.target.closest('[data-resolve]');if(resolve){const t=state.threads.find(t=>t.id===resolve.dataset.resolve);t.status=t.status==='open'?'resolved':'open';save();renderNav();renderThreads();return}
 const send=e.target.closest('[data-send]');if(send){const form=send.closest('.reply-form'),body=form.querySelector('textarea').value.trim();if(!body){toast('请先填写回复内容');return}const t=state.threads.find(t=>t.id===send.dataset.send);t.messages.push(message(body,form.querySelector('select').value));replyDrafts.delete(t.id);save();renderThreads();toast('回复已加入讨论')}
};
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function filename(s){return s.replace(/[^a-zA-Z0-9\u4e00-\u9fff_.-]/g,'_').slice(0,80)||'workspace'}
function exportState(s=state){const bundle=clone(s);bundle.exportedAt=now();download(filename(bundle.title)+'-handoff.json',JSON.stringify(bundle,null,2),'application/json');toast('交接包已导出：包含正文、批注、备忘与完整讨论')}
$('export-button').onclick=()=>leaveEditor(()=>exportState());$('download-md').onclick=()=>leaveEditor(()=>download(filename(doc().source||doc().title+'.md'),doc().markdown,'text/markdown;charset=utf-8'));
function feedbackPreview(data){
 if(!data||data.format!=='agent-docs-feedback'||data.version!==1||data.workspaceId!==state.id)fail('回复文件不属于当前工作区，或格式版本不匹配。');
 for(const key of ['replies','threads','changes'])if(data[key]!==undefined&&!Array.isArray(data[key]))fail(key+' 必须是数组。');
 const next=clone(state),ids=new Set(next.threads.flatMap(t=>t.messages.map(m=>m.id))),threads=new Map(next.threads.map(t=>[t.id,t])),docs=new Map(next.documents.map(d=>[d.id,d]));let newMessages=0,newThreads=0,changed=0,conflicts=0,skipped=0;
 for(const t of data.threads||[]){if(!threadValid(t)||!docs.has(t.documentId))fail('新讨论的内容或 documentId 无效。');const old=threads.get(t.id);if(old){const sameAnchor=['quote','before','after','revision'].every(k=>(old.anchor?.[k]??null)===(t.anchor?.[k]??null));const sameMessages=t.messages.every(m=>{const prior=old.messages.find(x=>x.id===m.id);return prior&&['author','role','intent','body','createdAt'].every(k=>prior[k]===m[k])});if(old.documentId!==t.documentId||old.kind!==t.kind||!sameAnchor||!sameMessages)fail('新讨论 ID 已存在且内容不一致；请使用 replies 回复已有讨论。');skipped++;continue}for(const m of t.messages){if(ids.has(m.id))fail('新讨论中存在重复消息 ID。');ids.add(m.id)}const fresh=clone(t);next.threads.push(fresh);threads.set(t.id,fresh);newThreads++}
 for(const r of data.replies||[]){if(!messageValid(r)||!threads.has(r.threadId))fail('回复字段无效或 threadId 不存在。');if(ids.has(r.id)){const old=next.threads.flatMap(t=>t.messages).find(m=>m.id===r.id);const target=threads.get(r.threadId);if(!target.messages.some(m=>m.id===r.id)||['author','role','intent','body','createdAt'].some(k=>old[k]!==r[k]))fail('同一消息 ID 对应不同内容，请保留原消息并创建新回复。');skipped++;continue}const {threadId,...m}=clone(r);threads.get(threadId).messages.push(m);ids.add(m.id);newMessages++}
 const changeIds=new Set(next.appliedChangeIds);
 for(const c of data.changes||[]){if(!c||!id(c.id)||!docs.has(c.documentId)||!Number.isSafeInteger(c.baseRevision)||c.baseRevision<1||!string(c.markdown)||!string(c.author,80)||!c.author.trim()||!string(c.summary??'',20000))fail('正文修改建议字段无效。');if(changeIds.has(c.id)){skipped++;continue}const d=docs.get(c.documentId);if(d.revision!==c.baseRevision){const t={id:uid(),documentId:d.id,kind:'comment',status:'open',dueDate:'',anchor:null,messages:[{id:uid(),author:c.author,role:'agent',intent:'rebuttal',body:'【版本冲突：未覆盖正文】\n修改基于 rev. '+c.baseRevision+'，当前为 rev. '+d.revision+'。\n'+(c.summary||'')+'\n\n建议正文：\n'+c.markdown,createdAt:now()}]};next.threads.push(t);conflicts++}else{d.markdown=c.markdown;d.revision++;d.updatedAt=now();changed++}changeIds.add(c.id);next.appliedChangeIds.push(c.id)}
 validateWorkspace(next);return{next,newMessages,newThreads,changed,conflicts,skipped};
}
$('import-button').onclick=()=>leaveEditor(()=>{$('json-input').value='';$('json-input').click()});
$('json-input').onchange=async e=>{
 const file=e.target.files[0];if(!file)return;if(file.size>20000000){toast('文件超过 20 MB，请拆分后导入');return}
 try{const data=JSON.parse(await file.text());if(data.format==='agent-docs-workspace'){
 validateWorkspace(data);modal('恢复完整交接包',`<p>将载入 <strong>${esc(data.title)}</strong>，其中包含 ${data.documents.length} 份文档和 ${data.threads.length} 条讨论。</p><div class="notice">这会替换当前页面的工作区。建议先导出当前内容，再恢复交接包。</div>`,'<button type="button" id="backup-current">导出当前内容</button><button type="button" data-close>取消</button><button type="submit" class="primary">恢复交接包</button>',()=>{if(data.id!==embedded.id){toast('此模板只恢复相同工作区的交接包，请用该工作区的 HTML 打开');return}state=clone(data);selectedDoc=state.documents[0].id;selectedThread=null;replyDrafts.clear();save();closeModal();render();toast('交接包已恢复')});$('backup-current').onclick=()=>exportState();
 }else{const p=feedbackPreview(data);modal('载入 agent 的回复',`<p>将合并到当前工作区：</p><ul><li>${p.newMessages} 条回复 · ${p.newThreads} 条新讨论</li><li>${p.changed} 份正文修改</li><li>${p.skipped} 项重复内容将跳过</li></ul>${p.conflicts?`<div class="notice">${p.conflicts} 项修改与当前版本冲突，将保留为待处理讨论，正文不会被覆盖。</div>`:''}`,'<button type="button" data-close>取消</button><button type="submit" class="primary">确认载入</button>',()=>{state=p.next;save();closeModal();render();toast('回复已载入'+(p.conflicts?'，请查看版本冲突讨论':''))})}
 }catch(error){toast('无法载入：'+error.message)}
};
$('recover-button').onclick=()=>{if(!recoveredDraft)return;modal('旧版本本地草稿','<p>这是重新生成 HTML 之前留在此浏览器中的草稿。你可以导出它交给 agent 合并，或将整个页面恢复为此草稿。</p><div class="notice">恢复会用旧草稿替换当前内容。请先导出需要保留的新版本。</div>','<button type="button" id="export-old">导出旧草稿</button><button type="button" data-close>取消</button><button type="submit" class="primary">恢复旧草稿</button>',()=>{state=clone(recoveredDraft);selectedDoc=state.documents[0].id;recoveredDraft=null;cacheWarning='';$('storage-warning').hidden=true;save();closeModal();render();toast('已恢复旧草稿')});$('export-old').onclick=()=>exportState(recoveredDraft)};
$('help-button').onclick=()=>modal('一份文档，一段持续的对话',`<div class="help-step"><b>1</b><p><strong>Agent 生成页面</strong><br>正文已经包含在 HTML 中，打开就能读。</p></div><div class="help-step"><b>2</b><p><strong>阅读与反馈</strong><br>选中同一段内的文字添加批注；也可添加整篇批注、备忘或编辑 Markdown 正文。</p></div><div class="help-step"><b>3</b><p><strong>导出交接包</strong><br>将 JSON 文件交给 agent。它包含正文、文档版本、引用与每条讨论。</p></div><div class="help-step"><b>4</b><p><strong>继续讨论</strong><br>Agent 可生成新版 HTML，或提供回复 JSON，通过右上角“载入回复”合并。</p></div><div class="notice">本地保存只属于当前浏览器。文件移动、浏览器清理或切换设备前，请导出交接包。备忘日期只在页面内显示到期状态。</div><p style="margin-top:18px">交给 agent 时可附上：</p><pre class="help-code">请阅读 JSON 交接包中的 documents 与 threads。\n逐条回应待处理讨论，保留文档、讨论和消息 ID。\n修订正文时增加 revision，并生成新版 HTML；\n或按 agent-docs-feedback v1 格式返回回复 JSON。</pre>`,'<button type="button" class="primary" data-close>开始协作</button>',null);
window.addEventListener('beforeunload',e=>{if(editingDirty||Array.from(replyDrafts.values()).some(d=>d.body.trim())){e.preventDefault();e.returnValue=''}});
try{render()}catch(error){$('article').textContent='无法读取此文档：'+error.message}
})();
</script>
